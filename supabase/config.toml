# Configuração do projeto Supabase
# Decisão de produto: cadastro público desativado (contas criadas exclusivamente por convite de superusuário).

[auth]
enabled = true
# O convite e a redefinição de senha levam para /redefinir-senha, onde a pessoa
# define a própria senha. O Auth só redireciona para URLs desta lista. Isto vale
# para o ambiente local; no projeto remoto, a lista fica em Authentication →
# URL Configuration → Redirect URLs (ver docs/09-progresso.md).
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/redefinir-senha",
  "http://127.0.0.1:5173/redefinir-senha",
]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Aqui enable_signup liga o PROVEDOR de e-mail (login com e-mail e senha), não o
# cadastro público: com false, o Auth responde "Email logins are disabled" e
# ninguém entra. O cadastro aberto fica fechado por [auth] enable_signup = false.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
